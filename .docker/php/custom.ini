; .docker/php/custom.ini
;
; Configuración de PHP para DESARROLLO LOCAL (la copia el Dockerfile a conf.d/).
; La guía la menciona pero no trae su contenido: este es el que usa SKYED.

; --- Zona horaria (igual que APP_TIMEZONE) ---
date.timezone = America/Bogota

; --- Memoria y tiempos (reportes PDF/Excel, copias de seguridad) ---
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; --- Subida de archivos (igual que client_max_body_size 100M de Nginx) ---
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 20

; --- Errores visibles en desarrollo ---
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; --- Seguridad básica ---
; No anunciar la versión de PHP en las cabeceras de respuesta.
expose_php = Off

; --- OPcache: acelera mucho PHP sobre carpetas de Windows montadas en Docker ---
; validate_timestamps=1 y revalidate_freq=0: los cambios en el código se ven al instante.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; --- Rutas reales en caché (menos accesos al disco montado) ---
realpath_cache_size = 4096K
realpath_cache_ttl = 600
