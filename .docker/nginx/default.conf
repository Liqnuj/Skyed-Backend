# .docker/nginx/default.conf
#
# Configuración de Nginx Optimizada para DESARROLLO LOCAL (API Laravel 13)
# ------------------------------------------------------------------------

server {
    # --- Configuración Básica del Servidor ---
    #
    # Escucha en el puerto 80 tanto para IPv4 como para IPv6.
    listen 80 default_server;
    listen [::]:80 default_server;

    # Acepta peticiones de cualquier nombre de host (localhost, 127.0.0.1, etc.)
    server_name _;

    # Directorio raíz de Laravel. Todas las peticiones entran por 'public'.
    root /var/www/html/public;

    # Archivo de índice por defecto.
    index index.php;

    # --- ¡CRÍTICO PARA EXCEL Y ARCHIVOS! ---
    #
    # Por defecto Nginx bloquea subidas mayores a 1MB.
    # Lo subimos a 100M para que coincida con nuestro 'custom.ini' de PHP.
    client_max_body_size 100M;

    # --- Archivos públicos subidos (fotos de perfil, imágenes de eventos, kits...) ---
    #
    # Se sirven directo desde storage/app/public. Así no dependemos del enlace
    # public/storage, que creado en Windows apunta a una ruta (C:\...) que no
    # existe dentro del contenedor de Linux.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
        expires 0;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # --- Manejo de Peticiones (Routing de la API) ---
    #
    # Intenta servir un archivo físico de public/ y si no existe,
    # envía la petición al enrutador de Laravel (index.php).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- Desactivación de Caché para Archivos Estáticos / Reportes ---
    #
    # Evita que el navegador guarde en caché imágenes o documentos servidos desde public/
    # durante las pruebas locales.
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|svg|pdf|xlsx|csv)$ {
        expires 0;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        log_not_found off;
    }

    # --- Bloque PHP-FPM Optimizado (Conexión con el contenedor PHP) ---
    #
    location ~ \.php$ {
        include fastcgi_params;

        # *** ¡PUNTO CRÍTICO DE CONEXIÓN! ***
        # 'api:9000' es la dirección interna en la red de Docker.
        # 'api' DEBE coincidir exactamente con el nombre del servicio de PHP
        # que definiremos en el 'docker-compose.yml' en el Paso 3.3.
        fastcgi_pass   api:9000;

        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Ampliamos el timeout a 5 minutos para procesos pesados en PostgreSQL 18,
        # generación de PDFs masivos o importaciones largas de Excel.
        fastcgi_read_timeout 300;

        # Previene la ejecución de URIs malformadas.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Si el archivo .php no existe físicamente, devuelve 404.
        try_files $fastcgi_script_name =404;
    }

    # --- Seguridad: Denegar Archivos Ocultos (.env, .git, .ht) ---
    #
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # --- Logs de Acceso y Error ---
    #
    # Redirigidos para poder inspeccionarlos en tiempo real con 'docker compose logs nginx_api'.
    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}