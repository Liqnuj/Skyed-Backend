$kind: http-request
description: Guarda el token automáticamente en {{token}} vía el script de la pestaña Tests.
url: "{{base_url}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "correo_u": "admin@skyed.test",
      "contrasena_u": "password123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          const data = pm.response.json();
          if (data.token) {
              pm.collectionVariables.set('token', data.token);
          }
      }
    language: text/javascript
order: 1000
